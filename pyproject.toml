[project]
name = "onehead"
version = "1.56.0"
description = "A Dota 2 in-house league Discord bot."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["dota", "discord", "inhouse"]

dependencies = [
    "aiohttp",
    "dacite",
    "discord.py>=2.1.0",
    "pynacl",
    "pytz",
    "structlog",
    "tabulate",
    "types-tabulate",
    "tinydb",
    "toml"
]

[project.optional-dependencies]
dev = [
    "black"
]
test = [
    "dpytest"
]

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onehead"]
exclude = ["secrets"]

[tool.black]
line-length = 120
