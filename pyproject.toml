[project]
name = "onehead"
version = "1.56.3"
description = "A Dota 2 in-house league Discord bot."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["dota", "discord", "inhouse"]

dependencies = [
    "aiohttp",
    "dacite",
    "discord.py>=2.6.0",
    "pynacl",
    "pytz",
    "structlog",
    "tabulate",
    "types-tabulate",
    "tinydb",
    "toml",
]

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onehead"]
exclude = ["secrets"]

[tool.black]
line-length = 120

[tool.isort]
multi_line_output = 3
line_length = 120
include_trailing_comma = false

[dependency-groups]
dev = [
    "black>=25.1.0",
    "dpytest>=0.7.0",
    "isort>=6.0.1",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]
